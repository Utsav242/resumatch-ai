version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: resumatch_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-resumatch_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-resumatch_secret_password}
      POSTGRES_DB: ${POSTGRES_DB:-resumatch_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-resumatch_user} -d ${POSTGRES_DB:-resumatch_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - resumatch_net

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend/Dockerfile.dev
    container_name: resumatch_backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-resumatch_user}:${POSTGRES_PASSWORD:-resumatch_secret_password}@postgres:5432/${POSTGRES_DB:-resumatch_db}
      BACKEND_CORS_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000"]'
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      GROQ_API_KEY: ${GROQ_API_KEY:-mock_key}
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - resumatch_net

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend/Dockerfile.dev
    container_name: resumatch_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_APP_ENV: development
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - resumatch_net

volumes:
  postgres_data:
    driver: local

networks:
  resumatch_net:
    driver: bridge
